[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnex-tracer"
# Single source of truth: winnex_tracer.__version__. Declaring the version in
# two places lets them drift, and a wheel can then publish with a version that
# disagrees with what the code reports at runtime.
dynamic = ["version"]
description = "The unified Winnex tracer family — shared core (WORM, Ed25519 signing, AuditCommitment) plus the gov/med/jus/gap domains, in one namespaced package."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Winnex Brasil Soluções Empresariais LTDA-ME", email = "pay@winnex.ai" },
]
keywords = [
    "audit", "worm", "ed25519", "compliance", "vector-search", "proof",
    "cauchy-schwarz", "tracer", "lgpd", "gdpr", "hipaa", "signature",
    "government", "healthcare", "legal", "financial", "non-repudiation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
signature = ["pynacl>=1.5"]
# O piso sobe para 1.9.23: e a versao que assina os campos de escopo
# (n_corpus, exact_scored, pruned_by_bound...). Com 1.9.22 o `verify_record`
# continua APROVANDO uma assinatura matematicamente impossivel, apenas
# declarando `claim_checkable: False` — medido em 2026-11-01.
madhava = ["winnex-madhava>=1.9.23"]
# MODOS QUE CERTIFICAM (2026-11-01). `core/certmode.py` importa
# `winnex_ai_normalize` para ROTEAR a config: sem ele, `open_engine(...,
# certificate_mode="commitment")` cai nos defaults do motor (random, s1=64),
# que medem 0,00% de cobertura — o modo diria "vou certificar" e nao teria o
# que certificar. A dependencia era fantasma: usada em producao e nao
# declarada em lugar nenhum.
certmode = ["pynacl>=1.5", "winnex-madhava>=1.9.23", "winnex-ai-normalize>=1.4.6"]
gov = ["fastapi>=0.100", "uvicorn>=0.20"]
med = ["fastapi>=0.100", "uvicorn>=0.20", "sentence-transformers>=2.2"]
jus = ["fastapi>=0.100", "uvicorn>=0.20", "sentence-transformers>=2.2"]
gap = ["fastapi>=0.100", "uvicorn>=0.20", "sentence-transformers>=2.2"]
pg = ["psycopg2-binary>=2.9"]
blockchain = ["web3>=6.0"]
all = [
    "pynacl>=1.5",
    "winnex-madhava>=1.9.23",
    "winnex-ai-normalize>=1.4.6",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "sentence-transformers>=2.2",
    "psycopg2-binary>=2.9",
    "web3>=6.0",
]

[project.urls]
Homepage = "https://winnex.ai"
Source = "https://github.com/winnex-ai/winnex-tracer"

[tool.pytest.ini_options]
testpaths = ["winnex_tracer/tests"]

[tool.setuptools.dynamic]
# Lido de winnex_tracer.__init__.__version__ — a única fonte de verdade.
version = { attr = "winnex_tracer.__version__" }

[tool.setuptools.packages.find]
include = ["winnex_tracer*"]

[tool.setuptools.package-data]
"winnex_tracer.gov" = ["config/**/*.json", "config/**/*.abi", "config/*.json", "config/*.abi"]
